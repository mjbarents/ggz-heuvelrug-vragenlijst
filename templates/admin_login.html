{% extends "base.html" %}

{% block title %}Admin Login - GGZ Heuvelrug{% endblock %}

{% block content %}
<div class="container center">
    <div class="card login-card">
        <div class="login-header">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="GGZ Heuvelrug" class="logo">
            <h1>Login</h1>
            <p class="login-subtitle">Log in om toegang te krijgen tot het admin panel</p>
        </div>
        
        <form method="POST" class="login-form">
            <div class="form-group">
                <label for="username">Gebruikersnaam</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password">Wachtwoord</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn-primary btn-full">Inloggen</button>
        </form>
    </div>
</div>
{% endblock %}
